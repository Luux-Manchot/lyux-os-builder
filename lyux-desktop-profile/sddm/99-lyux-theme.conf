[General]
# KDE Plasma en X11 : obligatoire (stabilité matérielle, Veyon, ADR-002 / ADR-014).
DisplayServer=x11

[Theme]
Current=lyux-sddm
CursorTheme=breeze_cursors
DisableUserList=true

[X11]
SessionDir=/usr/share/xsessions

[Users]
DefaultSession=plasmax11.desktop
RememberLastUser=false
HideUsers=lyux-admin,root
