---
# ==============================================================================
# Rôle LyuX-Profile-Salles : Déploiement des logiciels par discipline
# ==============================================================================

# --- Profil NSI & Mathématiques ---
- name: "Installation des paquets pour profil NSI & Maths"
  ansible.builtin.apt:
    name:
      - git
      - gcc
      - g++
      - gdb
      - code
      - jupyter-notebook
      - spyder
      - scilab
      - octave
      - wireshark
    state: present
  when: room_profile == 'nsi'

# --- Profil Sciences (Physique-Chimie & SVT) ---
- name: "Installation des paquets pour profil Sciences"
  ansible.builtin.apt:
    name:
      - avogadro
      - stellarium
      - tracker
      - qgis
      - gimp
      - imagej
    state: present
  when: room_profile == 'sciences'

# --- Profil Sciences de l'Ingénieur & Technologie ---
- name: "Installation des paquets pour profil Technologie"
  ansible.builtin.apt:
    name:
      - freecad
      - kicad
      - blender
      - prusa-slicer
    state: present
  when: room_profile == 'techno'

# ==============================================================================
# Tâches complémentaires : Raccourcis Bureau & Environnement Pédagogique
# ==============================================================================

- name: "Création des dossiers Bureau dans /etc/skel"
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: '0755'
  loop:
    - /etc/skel/Bureau
    - /etc/skel/Desktop

# --- Raccourcis Bureau NSI & Maths ---
- name: "Création du raccourci Bureau Thonny IDE (NSI/Maths)"
  ansible.builtin.copy:
    dest: "{{ item }}/Thonny_Python.desktop"
    mode: '0755'
    content: |
      [Desktop Entry]
      Version=1.0
      Type=Application
      Name=Thonny Python IDE
      Comment=Environnement de programmation Python pédagogique
      Exec=thonny %F
      Icon=thonny
      Terminal=false
      Categories=Development;IDE;Education;
  loop:
    - /etc/skel/Bureau
    - /etc/skel/Desktop
  when: room_profile == 'nsi'

- name: "Création du raccourci Bureau VS Code (NSI/Maths)"
  ansible.builtin.copy:
    dest: "{{ item }}/VS_Code.desktop"
    mode: '0755'
    content: |
      [Desktop Entry]
      Version=1.0
      Type=Application
      Name=Visual Studio Code
      Comment=Éditeur de code source et environnement NSI
      Exec=code --no-sandbox %F
      Icon=vscode
      Terminal=false
      Categories=Development;IDE;TextEditor;
  loop:
    - /etc/skel/Bureau
    - /etc/skel/Desktop
  when: room_profile == 'nsi'

- name: "Création du raccourci Bureau Jupyter Notebook (NSI/Maths)"
  ansible.builtin.copy:
    dest: "{{ item }}/Jupyter_Notebook.desktop"
    mode: '0755'
    content: |
      [Desktop Entry]
      Version=1.0
      Type=Application
      Name=Jupyter Notebook
      Comment=Cahier interactif Python pour l'algorithmique et les mathématiques
