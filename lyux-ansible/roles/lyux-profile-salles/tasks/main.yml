- name: "Création du raccourci Bureau Partages Salle B204 (NSI/Maths)"
  ansible.builtin.copy:
    dest: "{{ item }}/Partages_Classe_B204.desktop"
    mode: '0755'
    content: |
      [Desktop Entry]
      Version=1.0
      Type=Application
      Name=Partages Classe NSI (B204)
