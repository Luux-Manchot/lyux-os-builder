      Icon=jupyter
      Terminal=false
      Categories=Development;Education;Science;
  loop:
    - /etc/skel/Bureau
    - /etc/skel/Desktop
  when: room_profile == 'nsi'

- name: "Création du raccourci Bureau GeoGebra (NSI/Maths)"
