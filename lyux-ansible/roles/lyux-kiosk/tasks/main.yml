---
# ==============================================================================
# Rôle LyuX-Kiosk : Thème KDE Plasma moderne et Verrouillage Kiosk
# ==============================================================================

- name: "Création du répertoire de configuration globale KDE"
  ansible.builtin.file:
    path: /etc/xdg
    state: directory
    mode: '0755'

- name: "Application du verrouillage KDE Kiosk (kdeglobals)"
  ansible.builtin.template:
    src: kdeglobals.j2
    dest: /etc/xdg/kdeglobals
    owner: root
    group: root
    mode: '0644'

- name: "Interdiction de la modification des panneaux et widgets Plasma"
  ansible.builtin.copy:
    dest: /etc/xdg/plasma-kiosk.sh
    owner: root
    group: root
    mode: '0755'
    content: |
      #!/bin/sh
      # Verrouillage immutable des applets et widgets KDE
      export KDE_KIOSK_IMMUTABLE=1

- name: "Désactivation du Centre de Bienvenue KDE par défaut (plasma-welcome)"
  ansible.builtin.lineinfile:
    path: /etc/xdg/autostart/org.kde.plasma-welcome.desktop
    line: "Hidden=true"
    create: yes
    mode: '0644'

- name: "Lien symbolique du menu d'applications XDG KDE Plasma"
  ansible.builtin.file:
    src: /etc/xdg/menus/plasma-applications.menu
    dest: /etc/xdg/menus/applications.menu
    state: link
    force: yes

- name: "Activation automatique du Guide de Bienvenue LyuX"
  ansible.builtin.copy:
    src: /opt/lyux/apps/welcome/lyux-welcome.desktop
    dest: /etc/xdg/autostart/lyux-welcome.desktop
    remote_src: yes
    mode: '0644'
  ignore_errors: yes
