# ==============================================================================
# Configuration Maîtresse Calamares — LyuX OS (Opération Manchot)
# ==============================================================================
---
modules-search:
  - local
  - /usr/lib/x86_64-linux-gnu/calamares/modules
  - /usr/lib/calamares/modules
  - /etc/calamares/modules

sequence:
  - show:
      - welcome
      - locale
      - keyboard
      - partition
      - summary
  - exec:
      - partition
      - mount
      - unpackfs
      - machineid
      - fstab
      - locale
      - keyboard
      - localecfg
      - users
      - networkcfg
      - packages
      - grubcfg
      - bootloader
      - shellprocess@postinstall
      - umount
  - show:
      - finished

branding: lyux
prompt-install: false
dont-chroot: false
oem-setup: false
disable-cancel: false
