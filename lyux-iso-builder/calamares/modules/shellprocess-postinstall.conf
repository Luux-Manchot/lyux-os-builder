# ==============================================================================
# Configuration Module ShellProcess Post-Installation Calamares — LyuX OS
# ==============================================================================
---
dontChroot: false
timeout: 180
script:
  - name: "Activation de la locale française fr_FR.UTF-8"
    command: "/usr/sbin/locale-gen fr_FR.UTF-8 && /usr/sbin/update-locale LANG=fr_FR.UTF-8 LC_ALL=fr_FR.UTF-8"
  - name: "Configuration forcée du clavier AZERTY pc105 latin9"
    command: "/usr/bin/localectl set-keymap fr-latin9 && /usr/bin/localectl set-x11-keymap fr pc105 latin9"
  - name: "Cible de démarrage graphique par défaut (graphical.target)"
    command: "/bin/systemctl set-default graphical.target"
  - name: "Activation du service d'enrôlement automatique LyuX"
    command: "/bin/systemctl enable lyux-enrollment.service"
  - name: "Création des répertoires de configuration LyuX"
    command: "/bin/mkdir -p /opt/lyux /etc/lyux /etc/xdg/autostart"
  - name: "Désactivation du Welcome Center KDE par défaut"
    command: "/usr/bin/apt-get purge -y plasma-welcome || (/bin/mkdir -p /etc/xdg/autostart && echo 'Hidden=true' >> /etc/xdg/autostart/org.kde.plasma-welcome.desktop)"
  - name: "Activation de l'assistant personnalisé LyuX Welcome au démarrage"
    command: "/bin/cp /opt/lyux/apps/welcome/lyux-welcome.desktop /etc/xdg/autostart/ && /bin/cp /opt/lyux/apps/welcome/lyux-welcome.desktop /usr/share/applications/"
  - name: "Lien symbolique du menu d'applications XDG KDE Plasma"
    command: "/bin/ln -sf /etc/xdg/menus/plasma-applications.menu /etc/xdg/menus/applications.menu"
  - name: "Configuration de l'environnement Qt et KDE Plasma"
    command: "/bin/sh -c 'echo \"QT_QPA_PLATFORMTHEME=kde\" >> /etc/environment && echo \"XDG_CURRENT_DESKTOP=KDE\" >> /etc/environment'"
  - name: "Déploiement du profil graphique officiel LyuX"
    command: "/bin/bash /opt/lyux/desktop-profile/install-desktop-profile.sh || true"
