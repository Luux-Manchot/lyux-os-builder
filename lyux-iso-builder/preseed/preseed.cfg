# ==============================================================================
# Fichier Preseed Debian 13 Trixie (Installation 100% Automatique pour LyuX)
# ==============================================================================

# Langue et Clavier
d-i debian-installer/locale string fr_FR.UTF-8
d-i keyboard-configuration/xkb-keymap select fr(latin9)

# DHCP Debian temporaire pour installer le socle depuis les dépôts Debian.
# Aucune adresse, aucun nom de domaine et aucune configuration établissement ne sont figés.
d-i netcfg/enable boolean true
d-i netcfg/choose_interface select auto
d-i netcfg/disable_autoconfig boolean false
d-i netcfg/disable_dhcp boolean false
d-i netcfg/get_hostname string lyux-client-unassigned
d-i netcfg/get_domain string lyux.lan

# Miroir Debian automatique pendant l'installation; le dépôt LAN ou le proxy est injecté au build si disponible.
d-i mirror/country string manual
d-i mirror/http/mirror string deb.debian.org
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i apt-setup/use_mirror boolean true
d-i apt-setup/another boolean false
d-i apt-setup/cdrom/another boolean false
d-i apt-setup/cdrom/set-double boolean false
d-i apt-setup/services-select multiselect
d-i apt-setup/cdrom/set-first boolean true
d-i apt-setup/cdrom/set-next boolean false
d-i apt-setup/cdrom/set-failed boolean false
d-i apt-setup/disable-cdrom-entries boolean false
d-i mirror/http/proxy string @@LYUX_APT_PROXY@@

# Partitionnement Automatique du Disque (efface tout et prend tout le disque)
d-i partman-auto/method string regular
d-i partman-auto/choose_recipe select atomic
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true

# Compte administrateur local temporaire.
# Le mot de passe est injecté au build via LYUX_ADMIN_PASSWORD (jamais figé dans le dépôt).
# Son changement est imposé par l'OOBE (enroll.py), pas par chage : SDDM ne sait pas
# gérer un mot de passe expiré et refuserait la connexion.
d-i passwd/root-login boolean false
d-i passwd/user-fullname string Administrateur LyuX
d-i passwd/username string lyux-admin
d-i passwd/user-password password @@LYUX_ADMIN_PASSWORD@@
d-i passwd/user-password-again password @@LYUX_ADMIN_PASSWORD@@
d-i user-setup/allow-password-weak boolean false

# Socle de base, Plasma minimal et dépendances nécessaires à l'OOBE.
tasksel tasksel/first multiselect standard
d-i pkgsel/include string sddm xorg plasma-desktop python3-pyqt6 python3-requests python3-psutil python3-rich python3-pip python3-cryptography isc-dhcp-client curl cifs-utils openssh-server libnss-extrausers
d-i pkgsel/upgrade select none
popularity-contest popularity-contest/participate boolean false

# Chargeur de Démarrage GRUB
d-i grub-installer/only_debian boolean true
d-i grub-installer/bootdev string default

# Commande finale : installer les apps embarquées, vérifier le socle et activer l'OOBE.
# Aucun clone GitHub : l'ancien dépôt monolithique est archivé. Tout vient du média.
# Les thèmes/profils complets sont différés après le premier reboot / enrôlement.
d-i preseed/late_command string \
    set -e; \
    mkdir -p /target/var/lib/lyux; \
    echo "$(date -Iseconds) OK" > /target/var/lib/lyux/step-late-start; \
    mkdir -p /target/opt/lyux/apps; \
    cp -r /cdrom/lyux-payload/enrollment /target/opt/lyux/apps/enrollment; \
    cp -r /cdrom/lyux-payload/welcome /target/opt/lyux/apps/welcome; \
    chmod +x /target/opt/lyux/apps/enrollment/scripts/*.sh || true; \
    echo "$(date -Iseconds) OK" > /target/var/lib/lyux/step-payload-copied; \
    cp /target/opt/lyux/apps/enrollment/systemd/lyux-enrollment.service /target/etc/systemd/system/; \
    chmod 644 /target/etc/systemd/system/lyux-enrollment.service; \
    in-target systemctl enable lyux-enrollment.service; \
    echo "$(date -Iseconds) OK" > /target/var/lib/lyux/step-service-enabled; \
    in-target bash -c 'set -e; for pkg in sddm xorg plasma-desktop python3-pyqt6 python3-requests python3-psutil python3-rich python3-pip; do dpkg-query -W -f="\${Status}" "${pkg}" 2>/dev/null | grep -q "install ok installed" || exit 1; done'; \
    echo "$(date -Iseconds) OK" > /target/var/lib/lyux/step-packages-validated; \
    test -f /target/boot/grub/grub.cfg; \
    echo "$(date -Iseconds) OK" > /target/var/lib/lyux/step-grub-complete; \
    in-target mkdir -p /etc/lyux /etc/sddm.conf.d; \
    in-target bash -c 'printf "[Theme]\nDisableUserList=true\n\n[Users]\nRememberLastUser=false\nHideUsers=lyux-admin,root\n" > /etc/sddm.conf.d/99-lyux-login.conf'; \
    in-target touch /etc/lyux/first-boot.flag; \
    echo "$(date -Iseconds) OK" > /target/var/lib/lyux/step-late-complete

# Éjection du média d'installation et redémarrage automatique
d-i cdrom-detect/eject boolean true
d-i finish-install/reboot_in_progress note
